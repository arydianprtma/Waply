version: "3.8"

services:
  waply-web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: waply-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3001
      - GATEWAY_INTERNAL_URL=http://waply-gateway:3002
    volumes:
      - waply-data:/app/apps/web/.waply-data
    depends_on:
      - waply-gateway

  waply-gateway:
    build:
      context: .
      dockerfile: ./apps/gateway/Dockerfile
    container_name: waply-gateway
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
    volumes:
      - gateway-sessions:/app/apps/gateway/.sessions

volumes:
  waply-data:
  gateway-sessions:
