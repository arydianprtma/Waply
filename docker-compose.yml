services:
  waply-db:
    image: postgres:16-alpine
    container_name: waply-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waply_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-waply}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waply} -d ${POSTGRES_DB:-waply}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - waply-net

  waply-gateway:
    build:
      context: .
      dockerfile: ./apps/gateway/Dockerfile
    container_name: waply-gateway
    restart: always
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:3001,https://waply.web.id,https://ardp.my.id
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
    volumes:
      - gateway-sessions:/app/apps/gateway/.sessions
      - waply-shared-data:/app/.waply-data
    depends_on:
      waply-db:
        condition: service_healthy
    networks:
      - waply-net

  waply-web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://waply.web.id}
    container_name: waply-web
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://waply.web.id}
      - GATEWAY_INTERNAL_URL=http://waply-gateway:3002
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-true}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - waply-web-data:/app/apps/web/.waply-data
      - waply-shared-data:/app/.waply-data
    depends_on:
      waply-gateway:
        condition: service_started
      waply-db:
        condition: service_healthy
    networks:
      - waply-net

volumes:
  postgres-data:
    name: waply_postgres_data
  gateway-sessions:
    name: waply_gateway_sessions
  waply-web-data:
    name: waply_web_data
  waply-shared-data:
    name: waply_shared_data

networks:
  waply-net:
    name: waply_network
    driver: bridge
