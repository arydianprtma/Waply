<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- Cyan Stroke Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Emerald Stroke Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Signal Arc Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Rounded App Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="#34D399" stroke-width="4" stroke-opacity="0.25" />

  <!-- Background Ambient Glow -->
  <circle cx="190" cy="240" r="140" fill="#06B6D4" opacity="0.15" filter="url(#glow)" />
  <circle cx="330" cy="240" r="140" fill="#10B981" opacity="0.2" filter="url(#glow)" />

  <!-- Modern Waply 'W' Monogram & Chat Bubble Shape -->
  <g transform="translate(10, 0)">
    <!-- Radar Waves at top right of W -->
    <path d="M 345 160 A 55 55 0 0 1 385 200" fill="none" stroke="url(#arcGrad)" stroke-width="22" stroke-linecap="round" />
    <path d="M 375 125 A 100 100 0 0 1 445 195" fill="none" stroke="url(#arcGrad)" stroke-width="22" stroke-linecap="round" />

    <!-- Left Wing (Cyan) + Chat Bubble Pointer -->
    <path d="M 125 155 
             L 175 320 
             L 215 200 
             L 255 320 
             L 285 240 
             L 250 155" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Chat Bubble Tail at left base -->
    <path d="M 148 290 
             L 100 375 
             L 175 350" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Wing & Bridge (Emerald Green) -->
    <path d="M 215 200 
             L 255 320 
             L 330 155" 
          fill="none" 
          stroke="url(#emeraldGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center Bridge Highlight Core -->
    <circle cx="255" cy="320" r="18" fill="#FFFFFF" />
  </g>
</svg>